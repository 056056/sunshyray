<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>sunshyray — dipinti</title>
<meta name="description" content="sunshyray — dipinti originali. Una piccola galleria di quadri che guardano indietro.">
<meta name="theme-color" content="#f2ede3">
<meta property="og:title" content="sunshyray">
<meta property="og:description" content="Dipinti originali. Una piccola galleria di quadri che guardano indietro.">
<meta property="og:image" content="https://sunshyray.github.io/og.jpg">
<meta property="og:url" content="https://sunshyray.github.io/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/galleria-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/galleria-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="sunshyray">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Reenie+Beanie&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261123d">
</head>
<body>

<!-- filtro "tremolio" per i disegni a mano -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="boil"><feTurbulence id="boilT" type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
</svg>

<header class="top">
  <a href="#" class="sig" aria-label="sunshyray">sunshyray</a>
  <nav class="top__nav">
    <a href="#mostra" data-i18n="nav_works">opere</a>
    <a href="#quaderno" data-i18n="nav_nb">quaderno</a>
    <a href="#chi" data-i18n="nav_bio">chi sono</a>
    <a href="#scrivimi" data-i18n="nav_contact">scrivimi</a>
    <button class="lang" type="button" aria-label="Lingua / Language"><span data-l="it">it</span> / <span data-l="en">en</span></button>
  </nav>
</header>

<main>

  <!-- INTRO / MANIFESTO -->
  <section class="intro">
    <div class="intro__text">
      <h1 class="manifesto" id="manifesto" aria-live="off"></h1>
      <div class="doodle-eyes" aria-hidden="true">
        <svg viewBox="0 0 120 70" class="deye deye--red"><g class="lid">
          <path class="d" d="M6 38 C 30 6, 92 4, 114 37"/><path class="d" d="M8 39 C 34 64, 88 66, 112 35"/>
          <g class="iris"><circle class="blot" cx="60" cy="37" r="14"/><circle class="d" cx="60" cy="37" r="14"/><circle class="pup" cx="60" cy="37" r="5.5"/></g>
          <path class="d thin" d="M30 18 l-4 -9 M46 11 l-2 -10 M62 9 l0 -10 M78 11 l3 -9 M93 17 l5 -8"/>
        </g></svg>
        <svg viewBox="0 0 120 70" class="deye deye--white"><g class="lid">
          <path class="d" d="M6 37 C 30 5, 90 6, 113 38"/><path class="d" d="M7 38 C 36 66, 86 63, 113 36"/>
          <g class="iris"><circle class="d" cx="60" cy="37" r="14"/><circle class="pup" cx="60" cy="37" r="5.5"/></g>
          <path class="d thin" d="M28 19 l-5 -8 M44 12 l-2 -10 M61 9 l1 -10 M77 11 l3 -9 M92 18 l6 -7"/>
        </g></svg>
      </div>
      <a href="#mostra" class="hand intro__go" data-i18n="go">guarda le opere ↓</a>
    </div>

    <figure class="hung" id="hung" hidden>
      <svg class="hung__string" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M50 3 L4 39 M50 3 L96 39"/></svg>
      <span class="hung__nail" aria-hidden="true"></span>
      <button type="button" class="hung__canvas" id="hungBtn"><span class="cv" id="hungCv"><img id="hungImg" alt=""><i class="weave"></i></span></button>
      <figcaption class="hand" id="hungCap"></figcaption>
    </figure>
  </section>

  <!-- MOSTRA -->
  <section class="show" id="mostra">
    <div class="show__head">
      <h2 class="h2"><span data-i18n="works_title">Opere</span><svg class="scribble-under" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 9 C 40 3, 70 12, 110 7 S 170 3, 197 8"/></svg></h2>
      <p class="hand show__note" id="showNote"></p>
      <div class="filters" role="tablist">
        <button class="is-active" data-filter="all" data-i18n="f_all">tutte</button>
        <button data-filter="disponibile" data-i18n="f_avail">disponibili</button>
        <button data-filter="venduta" data-i18n="f_sold">vendute</button>
      </div>
    </div>
    <div class="wall" id="wall"></div>
    <p class="hand empty" id="empty" hidden data-i18n="empty">nuovi quadri in arrivo…</p>
  </section>

  <!-- QUADERNO -->
  <section class="notebook" id="quaderno">
    <h2 class="h2"><span data-i18n="nb_title">Il mio quaderno</span><svg class="scribble-under" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 8 C 45 3, 85 12, 125 6 S 180 4, 197 9"/></svg></h2>
    <p class="hand show__note" data-i18n="nb_note">pagine, schizzi, appunti</p>
    <div class="nb" id="nb"></div>
  </section>

  <!-- CHI SONO -->
  <section class="about" id="chi">
    <h2 class="h2"><span data-i18n="bio_title">Chi sono</span><svg class="scribble-under" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 7 C 50 11, 90 2, 130 8 S 180 10, 197 5"/></svg></h2>
    <div class="about__grid">
      <article class="letter">
        <span class="tape tape--l" aria-hidden="true"></span><span class="tape tape--r" aria-hidden="true"></span>
        <div class="letter__body" id="bioText"></div>
        <p class="letter__sign">sunshyray</p>
      </article>
    </div>
  </section>

  <!-- SCRIVIMI -->
  <section class="contact" id="scrivimi">
    <h2 class="h2"><span data-i18n="contact_title">Scrivimi</span><svg class="scribble-under" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 8 C 30 4, 80 11, 120 6 S 175 9, 197 6"/></svg></h2>
    <div class="postcard">
      <div class="postcard__msg">
        <p class="hand" data-i18n="pc_msg">Per acquistare un quadro o per commissioni, scrivimi.</p>
        <p class="hand postcard__sign">— s.</p>
      </div>
      <div class="postcard__addr">
        <div class="stamp" aria-hidden="true">
          <svg viewBox="0 0 120 70"><path class="d" d="M6 38 C 30 6, 92 4, 114 37"/><path class="d" d="M8 39 C 34 64, 88 66, 112 35"/><circle class="blot" cx="60" cy="37" r="14"/><circle class="d" cx="60" cy="37" r="14"/><circle class="pup" cx="60" cy="37" r="5.5"/></svg>
        </div>
        <ul class="postcard__lines" id="contactLinks"></ul>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <span>© <span id="year"></span> sunshyray — <span data-i18n="foot">tutte le opere sono dipinte a mano</span></span>
  <a href="#" data-i18n="top">torna su ↑</a>
</footer>

<!-- SCHEDA OPERA -->
<div class="room" id="room" aria-hidden="true" role="dialog" aria-modal="true">
  <button class="room__close hand" type="button" data-i18n="close">chiudi ✕</button>
  <div class="room__inner">
    <div class="room__wall"><div class="room__canvas cv" id="rCv"><img alt="" id="rImg"><i class="weave"></i></div></div>
    <div class="room__info">
      <div class="label label--big" id="rLabel"></div>
      <div class="room__desc" id="rDesc"></div>
      <div class="room__price" id="rPrice"></div>
      <div class="room__ask" id="rAsk"></div>
      <div class="room__nav hand">
        <button type="button" id="rPrev" data-i18n="prev">← quello prima</button>
        <button type="button" id="rNext" data-i18n="next">quello dopo →</button>
      </div>
    </div>
  </div>
</div>

<!-- FOTO DEL QUADERNO, INGRANDITA -->
<div class="lb" id="lb" aria-hidden="true" role="dialog" aria-modal="true">
  <button class="room__close hand" type="button" id="lbClose" data-i18n="close">chiudi ✕</button>
  <figure class="lb__fig"><span class="tape tape--c" aria-hidden="true"></span><img id="lbImg" alt=""><figcaption class="hand" id="lbCap"></figcaption></figure>
</div>

<script src="config.js?v=20261123d"></script>
<script src="js/main.js?v=20261123d"></script>
</body>
</html>
